[project]
name = "qumo-agents"
version = "0.1.0"
description = "QUMO agent layer: deepagents agents that research, review, improve and use QUMO"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7",
    "langchain-openai>=1.0",
    "langchain-mcp-adapters>=0.2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
qumo-agents = "qumo_agents.cli:main"

[tool.setuptools.packages.find]
include = ["qumo_agents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
