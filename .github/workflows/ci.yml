# QUMO continuous integration.
#
# STATUS: NOT YET RUN. This workflow was written during the 2026-11 project review and has never
# executed on GitHub Actions. Expect to adjust it after the first run.
#   - macos-15 (Apple silicon, arm64) is the platform QUMO is developed on; these commands pass locally there.
#   - ubuntu-latest (x86-64) is UNVERIFIED: the Mojo wheels exist for Linux, but `make test` and
#     `make examples` have not been run on Linux by this project. The Linux job is allowed to fail
#     (continue-on-error) until someone has seen it pass.
#   - Timings are guesses: `make test` compiles about 70 test files with `mojo run` (several seconds each
#     on an Apple M5; hosted runners are slower).
#   - The tests of the Python package (make test-python) run in a small venv with NumPy and pytest only.
#     They pass locally in such a venv on macOS; like the rest of this file they have not run here.
#   - GPU targets (make gpu-check, test-gpu) and the suites that need Qiskit, TKET, Cirq or Stim
#     (make setup-py, test-py) are not run here.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15        # arm64
            experimental: false
          - os: ubuntu-latest   # x86-64, UNVERIFIED (see the header)
            experimental: true
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Cache the Mojo toolchain (.venv)
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}

      - name: make setup (pinned Mojo toolchain into .venv)
        run: make setup

      - name: Toolchain version
        run: .venv/bin/mojo --version

      - name: make cli (build/qumo)
        run: make cli

      - name: Smoke test the CLI
        run: build/qumo run examples/foundations/bell.qasm --shots 1000 --seed 7

      - name: make test (every tests/test_*.mojo and the fast RL tests)
        run: make test

      # `make test-python` builds build/qumo_py.so (make py) and runs python/tests with it. The extension
      # is loaded by the Python that runs the tests, so that Python is 3.12, the version it is built for.
      - name: Python 3.12 venv with NumPy and pytest (for the qumo package tests)
        run: |
          uv venv build/ci-venv --python 3.12
          uv pip install --python build/ci-venv/bin/python numpy pytest

      - name: make test-python (build/qumo_py.so and the tests of the Python package)
        run: make test-python PY=build/ci-venv/bin/python

      - name: Editable install of the Python package, imported from another directory
        run: |
          uv pip install --python build/ci-venv/bin/python -e .
          cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/build/ci-venv/bin/python" -c "import qumo; print(qumo.sample(qumo.ghz(3, measure=True), shots=100))"

      # The examples runner needs only the Python standard library, so the runner's python3 replaces
      # bench/.venv (which `make setup-py` would create with Qiskit, TKET, Cirq, ...). Examples whose
      # requirements are missing (qumo_py, extra Python modules, GPU, network) are reported as SKIP.
      - name: Example headers and generated indexes are current
        run: python3 examples/run_examples.py --check-index

      - name: make examples (fast tier, verified by CHECK lines)
        run: make examples PY=python3

      - name: Upload the examples report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: examples-report-${{ matrix.os }}
          path: build/examples_report.json
          if-no-files-found: ignore
